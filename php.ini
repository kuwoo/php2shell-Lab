; php2shell Chain A 靶场配置（conf.d 覆盖）

; 1) 显式开启 upload_progress（默认就开，这里写清楚）
session.upload_progress.enabled = 1

; 2) 关闭 cleanup：让上传结束后进度数据仍留在会话文件里，演示才能确定性成功。
;    （真实环境默认 cleanup=On，攻击者用大文件 + 并发与上传窗口竞争，原理一样）
session.upload_progress.cleanup = 0

; 3) 固定会话保存目录，方便 LFI 用绝对路径 /tmp/sessions/sess_<id> 包含
session.save_path = /tmp/sessions
